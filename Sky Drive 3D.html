<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Drive 3D</title>
<style>
:root{--ink:#fff;--panel:rgba(12,16,28,.62);--accent:#ffcc33;--hot:#ff4d3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#fff;--panel:rgba(8,10,18,.7)}}
:root[data-theme="dark"]{--ink:#fff;--panel:rgba(8,10,18,.7)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#101522;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
.hidden{display:none!important}
h1{font-size:clamp(38px,8vw,76px);margin:0;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
p.sub{margin:0;font-size:clamp(14px,2.4vw,18px);opacity:.92;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{width:min(30vw,190px);min-width:130px;aspect-ratio:3/4;border-radius:18px;border:4px solid transparent;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font-size:20px;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7);transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.card .em{position:absolute;top:22%;left:0;right:0;font-size:56px}
.card:hover{transform:translateY(-4px)}
.card.sel{border-color:var(--accent);transform:translateY(-8px) scale(1.04);box-shadow:0 12px 28px rgba(0,0,0,.45)}
.card:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
#c-city{background:linear-gradient(#5b8fd0,#a9cdee 58%,#3b3f46 58%)}
#c-desert{background:linear-gradient(#f0a95b,#f6d79a 58%,#d9a95a 58%)}
#c-forest{background:linear-gradient(#6fbf8a,#b4e0b8 58%,#2c6e37 58%)}
.btn{font:inherit;font-size:22px;font-weight:800;padding:14px 46px;border:0;border-radius:999px;background:var(--accent);color:#2a1d00;cursor:pointer;box-shadow:0 6px 0 #b98a00,0 12px 24px rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b98a00}
.btn.alt{background:#fff;color:#1a2238;box-shadow:0 6px 0 #aab,0 12px 24px rgba(0,0,0,.35)}
.panel{background:var(--panel);padding:22px 34px;border-radius:20px;backdrop-filter:blur(6px)}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;font-size:clamp(18px,3.4vw,26px);font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);text-align:center;pointer-events:none;font-size:15px;opacity:.9;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.steer{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:68px;height:68px;border-radius:50%;border:0;background:var(--panel);color:#fff;font-size:30px}
#bl{left:16px}#br{right:16px}
@media (prefers-reduced-motion: reduce){.card,.btn{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden"><span id="score">Score 0</span><span id="lives">❤❤❤</span></div>
<div id="hint" class="hidden">Up arrow, Space, or click to fly. Left and right arrows to steer.</div>
<button id="bl" class="steer hidden" aria-label="Steer left">◀</button>
<button id="br" class="steer hidden" aria-label="Steer right">▶</button>

<div id="menu" class="layer">
  <h1>Sky Drive 3D</h1>
  <p class="sub">Choose your world, then hit the road.</p>
  <div class="cards" role="radiogroup" aria-label="World">
    <div class="card sel" id="c-city" data-t="city" role="radio" aria-checked="true" tabindex="0"><span class="em">🏙️</span>City</div>
    <div class="card" id="c-desert" data-t="desert" role="radio" aria-checked="false" tabindex="0"><span class="em">🏜️</span>Desert</div>
    <div class="card" id="c-forest" data-t="forest" role="radio" aria-checked="false" tabindex="0"><span class="em">🌲</span>Forest</div>
  </div>
  <button class="btn" id="start">Start game</button>
</div>

<div id="over" class="layer hidden">
  <div class="panel">
    <h1 style="font-size:clamp(32px,6vw,54px)">Crash!</h1>
    <p class="sub" id="final">Score 0</p>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:18px;flex-wrap:wrap">
      <button class="btn" id="again">Play again</button>
      <button class="btn alt" id="home">Change world</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const THEMES = {
  city:   {sky:0x78a9e0, fog:0xa6c8ec, ground:0x4a4f55},
  desert: {sky:0xf0b867, fog:0xf2d4a0, ground:0xdcae62},
  forest: {sky:0x86c9a0, fog:0xaedbb6, ground:0x2d7438}
};
let theme = 'city', state = 'menu', score = 0, lives = 3, speed = 24, inv = 0, spawnT = 1, last = 0;
const keys = {left:false, right:false}; let flyHeld = false;

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({canvas:$('c'), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(62, 1, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667766, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(10, 22, 12); scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshLambertMaterial({color:0x444444}));
ground.rotation.x = -Math.PI/2; ground.position.set(0, -0.02, -250); scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(11, 700), new THREE.MeshLambertMaterial({color:0x2b2d33}));
road.rotation.x = -Math.PI/2; road.position.set(0, 0.01, -250); scene.add(road);
const lineMat = new THREE.MeshBasicMaterial({color:0xffffff});
[-5.2, 5.2].forEach(x => { const l = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 700), lineMat); l.rotation.x = -Math.PI/2; l.position.set(x, 0.02, -250); scene.add(l); });
const dashes = [];
for (let i = 0; i < 24; i++) [-1.75, 1.75].forEach(x => {
  const d = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.02, 3.5), lineMat);
  d.position.set(x, 0.03, -i*12 + 10); scene.add(d); dashes.push(d);
});

// ---------- car ----------
const car = new THREE.Group(); scene.add(car);
const M = c => new THREE.MeshLambertMaterial({color:c});
const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 4), M(0xe63b2e)); body.position.y = 0.75; car.add(body);
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 1.9), M(0x9fd6ff)); cabin.position.set(0, 1.35, 0.2); car.add(cabin);
[[-1.05,1.3],[1.05,1.3],[-1.05,-1.3],[1.05,-1.3]].forEach(([x,z]) => {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.4, 16), M(0x111111));
  w.rotation.z = Math.PI/2; w.position.set(x, 0.46, z); car.add(w);
});
[-0.7, 0.7].forEach(x => { const h = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.22, 0.1), new THREE.MeshBasicMaterial({color:0xfff3a0})); h.position.set(x, 0.85, -2.02); car.add(h); });
const wings = new THREE.Group();
[-1, 1].forEach(s => { const w = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 1.1), M(0xf2f2f2)); w.position.set(s*2.0, 1.0, 0.1); w.rotation.z = s*-0.12; wings.add(w); });
wings.visible = false; car.add(wings);
car.userData = {vx:0, vy:0};

// ---------- decor ----------
const winTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = '#9aa7b8'; g.fillRect(0,0,64,64);
  g.fillStyle = '#ffe9a6';
  for (let y = 6; y < 60; y += 14) for (let x = 6; x < 60; x += 14) { g.globalAlpha = Math.random() < .7 ? 1 : .25; g.fillRect(x, y, 8, 8); }
  return new THREE.CanvasTexture(c);
})();
const decor = new THREE.Group(); scene.add(decor);
function makeDecor(t) {
  const g = new THREE.Group(), r = Math.random();
  if (t === 'city') {
    const h = 6 + Math.random()*24, w = 4 + Math.random()*4;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshLambertMaterial({color:0xb8c4d6, map:winTex}));
    m.position.y = h/2; g.add(m);
  } else if (t === 'desert') {
    if (r < .5) {
      const s = 0.8 + Math.random()*0.9, cm = M(0x3c8f3c);
      const tr = new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, 5, 8), cm); tr.position.y = 2.5; g.add(tr);
      [-1, 1].forEach(k => { const a = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, 1.8, 8), cm); a.position.set(k*0.95, 3 + k*0.3, 0); g.add(a);
        const b = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, 1, 8), cm); b.position.set(k*0.7, 2, 0); b.rotation.z = Math.PI/2; g.add(b); });
      g.scale.setScalar(s);
    } else {
      const d = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), M(r < .8 ? 0xd2a15a : 0x9a6b45));
      d.scale.set(4 + Math.random()*6, 1 + Math.random()*2.5, 4 + Math.random()*5); g.add(d);
    }
  } else {
    const s = 0.8 + Math.random()*1.1;
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(.45, .6, 3, 8), M(0x6b4423)); tr.position.y = 1.5; g.add(tr);
    const l1 = new THREE.Mesh(new THREE.ConeGeometry(2.6, 5, 9), M(0x1f6b2e)); l1.position.y = 5; g.add(l1);
    const l2 = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 9), M(0x2a8a3c)); l2.position.y = 7.5; g.add(l2);
    g.scale.setScalar(s);
  }
  return g;
}
function placeDecor(g, side, z) { g.position.set(side*(8.5 + Math.random()*16), 0, z); g.rotation.y = Math.random()*6; g.userData.side = side; }
function applyTheme(t) {
  theme = t; const T = THEMES[t];
  scene.background = new THREE.Color(T.sky);
  scene.fog = new THREE.Fog(T.fog, 60, 230);
  ground.material.color.setHex(T.ground);
  while (decor.children.length) decor.remove(decor.children[0]);
  for (let i = 0; i < 28; i++) [-1, 1].forEach(side => { const g = makeDecor(t); placeDecor(g, side, -i*9 + 12); decor.add(g); });
  document.querySelectorAll('.card').forEach(c => { const on = c.dataset.t === t; c.classList.toggle('sel', on); c.setAttribute('aria-checked', on); });
}

// ---------- items ----------
const items = [];
const coinGeo = new THREE.CylinderGeometry(.6, .6, .15, 20); coinGeo.rotateX(Math.PI/2);
const coinMat = new THREE.MeshLambertMaterial({color:0xffcc00, emissive:0x553d00});
const barGeo = new THREE.BoxGeometry(2.2, 1.2, 1), coneGeo = new THREE.ConeGeometry(.8, 1.8, 12);
const barMat = M(0xff7a1a), coneMat = M(0xff4d3d);
function spawn() {
  const lane = [-3.5, 0, 3.5][Math.random()*3 | 0];
  if (Math.random() < .55) {
    const hy = Math.random() < .4 ? 3 + Math.random()*3 : 1.1;
    for (let i = 0; i < 4; i++) { const c = new THREE.Mesh(coinGeo, coinMat); c.position.set(lane, hy, -130 - i*4); c.userData = {t:'coin'}; scene.add(c); items.push(c); }
  } else {
    const o = Math.random() < .5 ? new THREE.Mesh(barGeo, barMat) : new THREE.Mesh(coneGeo, coneMat);
    o.position.set(lane, o.geometry === barGeo ? .6 : .9, -130); o.userData = {t:'hit'}; scene.add(o); items.push(o);
  }
}
function clearItems() { items.forEach(i => scene.remove(i)); items.length = 0; }

// ---------- game flow ----------
function hud() { $('score').textContent = 'Score ' + score; $('lives').textContent = '❤'.repeat(Math.max(lives, 0)); }
function startGame() {
  score = 0; lives = 3; speed = 24; inv = 0; spawnT = 1; clearItems();
  car.position.set(0, 0, 0); car.userData.vx = car.userData.vy = 0;
  state = 'play'; hud();
  ['menu', 'over'].forEach(i => $(i).classList.add('hidden'));
  ['hud', 'hint', 'bl', 'br'].forEach(i => $(i).classList.remove('hidden'));
  setTimeout(() => $('hint').classList.add('hidden'), 6000);
}
function endGame() {
  state = 'over'; $('final').textContent = 'Score ' + score;
  $('over').classList.remove('hidden'); ['hud', 'hint', 'bl', 'br'].forEach(i => $(i).classList.add('hidden'));
}
function toMenu() { state = 'menu'; clearItems(); car.position.set(0, 0, 0); wings.visible = false; $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); }

// ---------- input ----------
document.querySelectorAll('.card').forEach(c => {
  c.addEventListener('click', () => applyTheme(c.dataset.t));
  c.addEventListener('keydown', e => { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); applyTheme(c.dataset.t); } });
});
$('start').onclick = startGame; $('again').onclick = startGame; $('home').onclick = toMenu;
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (state !== 'play') return;
  if (['ArrowUp', 'Space', 'KeyW'].includes(e.code)) flyHeld = true;
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
});
addEventListener('keyup', e => {
  if (['ArrowUp', 'Space', 'KeyW'].includes(e.code)) flyHeld = false;
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
});
$('c').addEventListener('pointerdown', () => { if (state === 'play') { flyHeld = true; if (car.position.y < 0.2) car.userData.vy = 7; } });
addEventListener('pointerup', () => flyHeld = false);
[['bl', 'left'], ['br', 'right']].forEach(([id, k]) => {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.stopPropagation(); keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => keys[k] = false));
});

// ---------- loop ----------
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w/h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

function loop(t) {
  const dt = Math.min(0.05, (t - last)/1000); last = t;
  const play = state === 'play', sp = play ? speed : 9;
  const u = car.userData;

  decor.children.forEach(g => { g.position.z += sp*dt; if (g.position.z > 14) { g.position.z -= 252; g.position.x = g.userData.side*(8.5 + Math.random()*16); } });
  dashes.forEach(d => { d.position.z += sp*dt; if (d.position.z > 14) d.position.z -= 288; });

  if (play) {
    speed = Math.min(52, speed + dt*0.35);
    // steer
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    u.vx += (dir*14 - u.vx)*Math.min(1, dt*8);
    car.position.x = Math.max(-4.4, Math.min(4.4, car.position.x + u.vx*dt));
    // fly
    if (flyHeld) u.vy = Math.min(8, u.vy + 34*dt);
    u.vy -= 18*dt;
    car.position.y += u.vy*dt;
    if (car.position.y <= 0) { car.position.y = 0; u.vy = 0; }
    if (car.position.y > 9) { car.position.y = 9; u.vy = Math.min(0, u.vy); }
    wings.visible = car.position.y > 0.3;
    car.rotation.z = -u.vx*0.03; car.rotation.x = u.vy*0.025;

    // items
    spawnT -= dt; if (spawnT < 0) { spawn(); spawnT = (16 + Math.random()*14)/speed; }
    inv = Math.max(0, inv - dt); car.visible = inv <= 0 || Math.floor(inv*10) % 2 === 0;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; it.position.z += speed*dt;
      if (it.userData.t === 'coin') it.rotation.y += dt*4;
      const hitXZ = Math.abs(it.position.x - car.position.x) < 1.5 && Math.abs(it.position.z) < 2;
      if (hitXZ) {
        if (it.userData.t === 'coin' && Math.abs(it.position.y - (car.position.y + 1)) < 1.6) { score += 10; scene.remove(it); items.splice(i, 1); hud(); continue; }
        if (it.userData.t === 'hit' && car.position.y < 1.6 && inv <= 0) { lives--; inv = 1.6; u.vy = 5; hud(); if (lives <= 0) { endGame(); } }
      }
      if (it.position.z > 12) { scene.remove(it); items.splice(i, 1); }
    }
    score += 0; 
    cam.position.set(car.position.x*0.55, 4.2 + car.position.y*0.55, 9.5);
    cam.lookAt(car.position.x*0.3, 1.5 + car.position.y*0.4, -8);
  } else {
    car.visible = true;
    const a = t/4000;
    cam.position.set(Math.sin(a)*3, 4.2, 9.5); cam.lookAt(0, 1.5, -8);
  }
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
applyTheme('city');
requestAnimationFrame(loop);
</script>
</body>
</html>
